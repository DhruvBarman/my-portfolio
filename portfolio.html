.page-nav {
    width: min(100%, 900px);
    margin: 14px auto 28px;
    display: flex;
    justify-content: flex-start;
}

.page-nav a {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 10px 16px;
    color: #dfe5ec;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    background: rgba(17, 24, 39, 0.78);
    border: 1px solid rgba(223, 229, 236, 0.16);
    border-radius: 10px;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.18);
    transition: background 180ms ease, border-color 180ms ease, transform 180ms ease;
}

.page-nav a span {
    font-size: 18px;
    line-height: 1;
}

.page-nav a:hover {
    background: #1e1b4b;
    border-color: rgba(223, 229, 236, 0.35);
    transform: translateY(-2px);
}

.page-nav a:focus-visible {
    outline: 2px solid #dfe5ec;
    outline-offset: 3px;
}
